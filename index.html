<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEC; --line:#D5DEDB;
  --ink:#16211E; --muted:#5B6B66; --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#DDEEE8;
  --warn:#A8690F; --danger:#B3413A; --danger-soft:#F6E1DF;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2A3834;
    --ink:#E3EBE8; --muted:#93A5A0; --accent:#4FB39A; --accent-ink:#06120E; --accent-soft:#1B3A31;
    --warn:#E0A64A; --danger:#E27A72; --danger-soft:#3A1F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2A3834;
  --ink:#E3EBE8; --muted:#93A5A0; --accent:#4FB39A; --accent-ink:#06120E; --accent-soft:#1B3A31;
  --warn:#E0A64A; --danger:#E27A72; --danger-soft:#3A1F1D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--body);
  padding-inline:16px; padding-block:0 96px;
  padding-top:env(safe-area-inset-top,0px);
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px;flex-wrap:wrap}
h1{font:700 28px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
h2{font:600 18px/1.2 var(--display);margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:720px}
nav.tabs button{
  flex:1;border:0;background:none;color:var(--muted);font:600 13px var(--body);
  padding:10px 4px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px
}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .v{font:500 17px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
form.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;grid-template-columns:repeat(6,1fr)}
form.add .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.span6{grid-column:span 6}.span3{grid-column:span 3}.span2{grid-column:span 2}
@media (max-width:520px){ .m-span3{grid-column:span 3} .m-span6{grid-column:span 6} }
label.l{font-size:12px;color:var(--muted);font-weight:500}
input,select{
  width:100%;font:15px var(--body);color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);
  padding:9px 14px;border-radius:8px;cursor:pointer;min-height:40px
}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--muted)}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:14px;height:14px;opacity:0}
.item.done .check svg{opacity:1}
.item.picked .check{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.item.picked .check svg{opacity:1}
.item.picked .name{color:var(--accent)}
.shop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line);flex-wrap:wrap}
.shop-h .shop-name{font:600 15px var(--display)}
.shop-h .btn{min-height:34px;padding:6px 12px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:0}
.shop-h:last-child{border-bottom:0}
.shop-t{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:6px}
.shop-t svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted)}
.shop-t[aria-expanded="false"] svg{transform:rotate(-90deg)}
.shop-t:disabled{cursor:default}
.shop-t:disabled svg{visibility:hidden}
.search-row{display:flex;gap:8px;align-items:center}
.search-row .search{flex:1;min-width:0}
.search-row .btn{white-space:nowrap}
.item-note{font-size:12px;margin:2px 0 0;color:var(--muted);line-height:1.4}
.item-note.dup{color:var(--warn);font-weight:600}
.dup-list{background:var(--bg);border:1px solid var(--line);border-radius:8px}
.dup-list div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.dup-list div:last-child{border-bottom:0}
.search{position:relative}
.search svg.lens{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{padding-left:36px;padding-right:40px;background:var(--surface);min-height:42px}
.search input::-webkit-search-cancel-button{display:none}
.search .x{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.bill{background:var(--bg);border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto}
.bill div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}
.bill div:last-child{border-bottom:0}
.amt{font:500 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.x svg{width:16px;height:16px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-right:4px}
.pill.mode{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.exp .item{grid-template-columns:1fr auto auto}

/* day nav */
.daynav{display:flex;align-items:center;gap:8px}
.daynav input{width:auto;flex:1;max-width:190px}
.daynav .btn{padding:8px 12px}

/* summary */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over i{background:var(--danger)}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.cat-row .bar{grid-column:span 2;height:6px}
.chart-scroll{overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;min-width:100%;padding-top:18px;border-bottom:1px solid var(--line);position:relative}
.chart .c{flex:1 0 12px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.chart .c b{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.chart .c.today b{opacity:1;background:var(--warn)}
.chart .c:hover b{opacity:1}
.axis{display:flex;gap:3px;font:500 10px var(--mono);color:var(--muted)}
.axis span{flex:1 0 12px;text-align:center}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* modal */
.back{position:fixed;inset:0;background:rgba(8,14,12,.5);display:grid;place-items:end center;z-index:50;padding:16px}
@media (min-width:560px){.back{place-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.sheet{max-height:calc(100vh - 32px);overflow:auto}
.syncbtn{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--warn)} .dot.err{background:var(--danger)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps code,.code-inline{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
textarea.code{width:100%;height:140px;font:12px/1.45 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.status-line{font-size:13px;color:var(--muted);margin:0}
.status-line.err{color:var(--danger)}
section[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,.check{transition:background .15s,border-color .15s,color .15s} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Kharcha <span>Book</span></h1>
      <p class="sub" id="todayLine"></p>
    </div>
    <div class="row">
      <button class="btn syncbtn" id="syncBtn" type="button"><span class="dot" id="syncDot"></span><span id="syncLabel">Sync off</span></button>
      <button class="btn ghost" id="exportBtn" type="button">Backup</button>
      <button class="btn ghost" id="importBtn" type="button">Restore</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="strip">
    <div><span class="label">Today</span><span class="v" id="sToday">₹0</span></div>
    <div><span class="label">This month</span><span class="v" id="sMonth">₹0</span></div>
    <div><span class="label">To buy (est.)</span><span class="v" id="sList">₹0</span></div>
  </div>

  <!-- SHOPPING -->
  <section id="tab-list">
    <div class="wrap" style="gap:14px">
      <form class="add" id="itemForm" autocomplete="off">
        <div class="f span6"><label class="l" for="iName">Item</label><input id="iName" list="itemNames" placeholder="e.g. Tomatoes" required><datalist id="itemNames"></datalist><p class="item-note" id="iNote" role="status" hidden></p></div>
        <div class="f span2 m-span3"><label class="l" for="iQty">Qty</label><input id="iQty" type="number" min="0" step="any" value="1" inputmode="decimal"></div>
        <div class="f span2 m-span3"><label class="l" for="iUnit">Unit</label>
          <select id="iUnit"><option>kg</option><option>g</option><option>L</option><option>ml</option><option selected>pcs</option><option>dozen</option><option>packet</option><option>bundle</option></select></div>
        <div class="f span2 m-span3"><label class="l" for="iPrice">Est. price ₹</label><input id="iPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div>
        <div class="f span3 m-span3"><label class="l" for="iShop">Shop</label><input id="iShop" list="shopList" placeholder="e.g. Kirana store"><datalist id="shopList"></datalist></div>
        <div class="f span3 m-span6" style="justify-content:flex-end"><button class="btn pri" type="submit">Add to list</button></div>
      </form>
      <div class="row between">
        <div class="chips" id="listFilter">
          <button class="chip" type="button" data-f="pending" aria-pressed="true">To buy</button>
          <button class="chip" type="button" data-f="bought" aria-pressed="false">Bought</button>
          <button class="chip" type="button" data-f="all" aria-pressed="false">All</button>
        </div>
        <button class="btn ghost danger" id="clearBought" type="button">Clear bought</button>
      </div>
      <div class="search-row">
      <div class="search">
        <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input id="listSearch" type="search" placeholder="Search item or shop" aria-label="Search item or shop" autocomplete="off" enterkeyhint="search">
        <button class="x" id="searchClear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <button class="btn" id="foldAll" type="button" hidden>Hide all</button>
      </div>
      <p class="hint">Tick items as you pick them up. When you pay, tap <b>Pay bill</b> on that shop and enter the total once. Tap a shop name to hide or show its items.</p>
      <div class="list" id="itemList"></div>
    </div>
  </section>

  <!-- EXPENSES -->
  <section id="tab-exp" hidden>
    <div class="wrap" style="gap:14px">
      <div class="row between">
        <div class="daynav">
          <button class="btn" type="button" id="dPrev" aria-label="Previous day">‹</button>
          <input type="date" id="dPick" aria-label="Date">
          <button class="btn" type="button" id="dNext" aria-label="Next day">›</button>
        </div>
        <button class="btn ghost" type="button" id="dToday">Today</button>
      </div>
      <form class="add" id="expForm" autocomplete="off">
        <div class="f span6"><label class="l" for="eDesc">What for</label><input id="eDesc" placeholder="e.g. Milk, auto fare, electricity bill" required></div>
        <div class="f span2 m-span3"><label class="l" for="eAmt">Amount ₹</label><input id="eAmt" type="number" min="0" step="any" inputmode="decimal" required></div>
        <div class="f span2 m-span3"><label class="l" for="eMode">Paid by</label>
          <select id="eMode"><option>UPI</option><option>Cash</option><option>Card</option></select></div>
        <div class="f span2 m-span6"><label class="l" for="eCat">Category</label><select id="eCat"></select></div>
        <div class="f span6"><button class="btn pri" type="submit">Add expense</button></div>
      </form>
      <div class="list exp" id="expList"></div>
      <div class="row between">
        <span class="label">Recent days</span>
      </div>
      <div class="list exp" id="recentDays"></div>
    </div>
  </section>

  <!-- SUMMARY -->
  <section id="tab-sum" hidden>
    <div class="wrap" style="gap:14px">
      <div class="row between">
        <div class="daynav">
          <button class="btn" type="button" id="mPrev" aria-label="Previous month">‹</button>
          <input type="month" id="mPick" aria-label="Month">
          <button class="btn" type="button" id="mNext" aria-label="Next month">›</button>
        </div>
        <button class="btn ghost" type="button" id="csvBtn">Export CSV</button>
      </div>

      <div class="card" id="budgetCard"></div>

      <div class="card">
        <div class="row between"><h2>Day by day</h2><span class="label" id="chartMax"></span></div>
        <div class="chart-scroll"><div style="min-width:420px">
          <div class="chart" id="chart"></div>
          <div class="axis" id="axis"></div>
        </div></div>
        <p class="sub" style="margin:0">Tap a bar to open that day's expenses.</p>
      </div>

      <div class="card">
        <h2>By category</h2>
        <div id="cats" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>

      <div class="card">
        <h2>By payment mode</h2>
        <div id="modes" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="list" aria-selected="true" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.2" fill="currentColor"/><circle cx="17" cy="20" r="1.2" fill="currentColor"/></svg>Shopping</button>
  <button role="tab" data-tab="exp" aria-selected="false" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12M6 9h12M13 20 6 13h3a4 4 0 0 0 0-9"/></svg>Expenses</button>
  <button role="tab" data-tab="sum" aria-selected="false" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Summary</button>
</div></nav>

<script type="text/plain" id="gsCode">
// Kharcha Book – Google Sheet sync
// 1. Change SECRET below to your own password.
// 2. Deploy > New deployment > Web app > Execute as: Me, Who has access: Anyone.
// 3. Paste the Web app URL and this password into Kharcha Book > Sync.

const SECRET = 'change-this-password';

const TABLES = {
  items: { sheet: 'Items', cols: [
    ['id', 'ID'], ['name', 'Item'], ['qty', 'Qty'], ['unit', 'Unit'], ['price', 'Est. price'],
    ['shop', 'Shop'], ['state', 'Status'], ['purchaseId', 'Bill ID'], ['u', 'Updated'], ['del', 'Deleted']
  ]},
  expenses: { sheet: 'Expenses', cols: [
    ['id', 'ID'], ['date', 'Date'], ['desc', 'Description'], ['amount', 'Amount'], ['cat', 'Category'],
    ['mode', 'Paid by'], ['shop', 'Shop'], ['u', 'Updated'], ['del', 'Deleted']
  ]}
};
const NUM = { qty: true, price: true, amount: true, u: true };

function doGet() {
  return json_({ ok: true, message: 'Kharcha Book sync is running.' });
}

function doPost(e) {
  let body;
  try { body = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'Bad request' }); }
  if (body.key !== SECRET) return json_({ ok: false, error: 'Wrong secret key' });

  const lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const out = { ok: true };
    Object.keys(TABLES).forEach(name => {
      const t = TABLES[name];
      const sh = sheet_(ss, t);
      const map = read_(ss, sh, t);
      let changed = false;
      (body[name] || []).forEach(r => {
        if (!r || !r.id) return;
        const cur = map[r.id];
        if (!cur || (Number(r.u) || 0) > (Number(cur.u) || 0)) { map[r.id] = r; changed = true; }
      });
      const rows = Object.keys(map).map(k => map[k]);
      if (changed) write_(sh, t, rows, name);
      out[name] = rows;
    });
    out.settings = settings_(ss, body.settings);
    return json_(out);
  } finally {
    lock.releaseLock();
  }
}

// When you edit a row directly in the sheet, mark it as changed so the app picks it up.
function onEdit(e) {
  const sh = e.range.getSheet();
  const t = Object.values(TABLES).find(x => x.sheet === sh.getName());
  if (!t || e.range.getLastRow() < 2) return;
  const n = t.cols.length;
  const uCol = t.cols.findIndex(c => c[0] === 'u') + 1;
  const first = Math.max(e.range.getRow(), 2);
  for (let r = first; r <= e.range.getLastRow(); r++) {
    const vals = sh.getRange(r, 1, 1, n).getValues()[0];
    const hasContent = vals.some((v, i) => i !== 0 && i !== uCol - 1 && v !== '' && v !== false);
    if (!hasContent) continue;
    if (!vals[0]) sh.getRange(r, 1).setValue('sh' + Date.now().toString(36) + r);
    sh.getRange(r, uCol).setValue(Date.now());
  }
}

function sheet_(ss, t) {
  let sh = ss.getSheetByName(t.sheet);
  if (!sh) {
    sh = ss.insertSheet(t.sheet);
    sh.getRange(1, 1, 1, t.cols.length).setValues([t.cols.map(c => c[1])]).setFontWeight('bold');
    sh.setFrozenRows(1);
    t.cols.forEach((c, i) => {
      const col = sh.getRange(1, i + 1, sh.getMaxRows(), 1);
      if (c[0] === 'id' || c[0] === 'date' || c[0] === 'purchaseId') col.setNumberFormat('@');
      if (c[0] === 'u') col.setNumberFormat('0');
    });
  }
  return sh;
}

function read_(ss, sh, t) {
  const tz = ss.getSpreadsheetTimeZone();
  const map = {};
  const last = sh.getLastRow();
  if (last < 2) return map;
  sh.getRange(2, 1, last - 1, t.cols.length).getValues().forEach(row => {
    const r = {};
    t.cols.forEach((c, i) => {
      const k = c[0];
      let v = row[i];
      if (v instanceof Date) v = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
      if (k === 'del') v = v === true || String(v).toUpperCase() === 'TRUE';
      else if (NUM[k]) v = Number(v) || 0;
      else v = v === '' || v === null ? '' : String(v);
      r[k] = v;
    });
    if (r.id) map[r.id] = r;
  });
  return map;
}

function write_(sh, t, rows, name) {
  if (name === 'expenses') rows.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  else rows.sort((a, b) => String(a.shop || '').localeCompare(String(b.shop || '')));
  const data = rows.map(r => t.cols.map(c => {
    const v = r[c[0]];
    if (c[0] === 'del') return !!v;
    return v === undefined || v === null ? '' : v;
  }));
  const last = sh.getLastRow();
  if (last >= 2) sh.getRange(2, 1, last - 1, t.cols.length).clearContent();
  if (data.length) sh.getRange(2, 1, data.length, t.cols.length).setValues(data);
}

function settings_(ss, incoming) {
  const props = PropertiesService.getScriptProperties();
  let cur = {};
  try { cur = JSON.parse(props.getProperty('settings') || '{}'); } catch (e) {}
  if (incoming && (Number(incoming.u) || 0) > (Number(cur.u) || 0)) {
    cur = incoming;
    props.setProperty('settings', JSON.stringify(cur));
    let sh = ss.getSheetByName('Settings');
    if (!sh) {
      sh = ss.insertSheet('Settings');
      sh.getRange(1, 1, 1, 2).setValues([['Setting', 'Value']]).setFontWeight('bold');
    }
    const rows = [['Monthly budget', cur.budget || 0]];
    Object.keys(cur.shopCat || {}).forEach(s => rows.push(['Category for ' + s, cur.shopCat[s]]));
    const last = sh.getLastRow();
    if (last >= 2) sh.getRange(2, 1, last - 1, 2).clearContent();
    sh.getRange(2, 1, rows.length, 2).setValues(rows);
  }
  return cur;
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

<script>
(function(){

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function migrate(s){
  s.shopCat = s.shopCat || {};

  s.tomb.items = s.tomb.items || {}; s.tomb.expenses = s.tomb.expenses || {};

  return s;
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); if(s&&Array.isArray(s.items)&&Array.isArray(s.expenses)) return migrate(s); } }catch(e){}
  return sample();
}
let S = load();
let storageOk = true;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ if(storageOk){ storageOk=false; toast('This browser is not saving data. Use Backup to keep a copy.'); } } }

/* change tracking: compare with a snapshot after every change, stamp what changed */
const settingsOf = () => ({budget:+S.budget||0, shopCat:S.shopCat||{}});

}
function stamp(){
  const now=Date.now(); let changed=false;
  TABLES.forEach(k=>{
    const seen=new Set();
    S[k].forEach(r=>{ seen.add(r.id); if(snap[k].get(r.id)!==body(r)){ r.u=now; delete r.ex; delete S.tomb[k][r.id]; changed=true; } });
    snap[k].forEach((_,id)=>{ if(!seen.has(id)){ S.tomb[k][id]=now; changed=true; } });
  });
  if(JSON.stringify(settingsOf())!==snap.settings){ S.settingsU=now; S.sample=false; changed=true; }
  takeSnap();
  return changed;
}
takeSnap();

let folded=new Set();
try{ folded=new Set(JSON.parse(localStorage.getItem(KEY+'-folded')||'[]')); }catch(e){}
const saveFolded=()=>{ try{ localStorage.setItem(KEY+'-folded',JSON.stringify([...folded])); }catch(e){} };
let shownShops=[];

function allShops(){ const set=new Set(); S.items.forEach(i=>{ if(i.shop) set.add(String(i.shop).trim()); }); Object.keys(S.shopCat||{}).forEach(s=>set.add(s)); DEFAULT_SHOPS.forEach(s=>set.add(s)); return [...set]; }
/* item memory: last shop / unit / price used for each item name (kept per device, plus whatever is in the synced list) */
const norm = s => String(s??'').toLowerCase().replace(/\s+/g,' ').trim();
let hist={}; try{ hist=JSON.parse(localStorage.getItem(KEY+'-hist')||'{}')||{}; }catch(e){}
const saveHist=()=>{ try{ localStorage.setItem(KEY+'-hist',JSON.stringify(hist)); }catch(e){} };
function remember(i){
  const k=norm(i.name); if(!k) return false;
  const t=+i.u||0, cur=hist[k];
  if(cur && cur.t>t) return false;
  const rec={name:String(i.name).trim(),shop:String(i.shop||'').trim(),unit:i.unit||'pcs',qty:+i.qty||0,price:+i.price||0,t};
  if(cur && JSON.stringify(cur)===JSON.stringify(rec)) return false;
  hist[k]=rec; return true;
}
const lastFor = name => hist[norm(name)] || null;
const openDups = name => { const k=norm(name); return k ? S.items.filter(i=>i.state!=='bought' && norm(i.name)===k) : []; };
const lastBought = name => { const k=norm(name); if(!k) return null;
  return S.items.filter(i=>i.state==='bought' && norm(i.name)===k).sort((a,b)=>(+b.u||0)-(+a.u||0))[0] || null; };
function renderShopList(){

let toastT;

  t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></svg>';
const sumOf = arr => arr.reduce((a,e)=>a+(+e.amount||0),0);
const dateOf = e => String(e.date||'');

/* ---------- render ---------- */
function renderStrip(){

}

function renderItems(){
  renderShopList();
  const el=$('#itemList');
  const inTab=i=>listFilter==='all'||(listFilter==='bought'?i.state==='bought':i.state!=='bought');
  const words=listSearch.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const matches=i=>{ const hay=(i.name+' '+shopOf(i)).toLowerCase(); return words.every(w=>hay.includes(w)); };
  const hl=t=>{ if(!words.length) return esc(t);
    const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');

      : `<p class="sub" style="margin:0">No expenses this month.</p>`; };
  const cm={}, mm={}; ex.forEach(e=>{ cm[e.cat||'Other']=(cm[e.cat||'Other']||0)+(+e.amount||0); mm[e.mode||'Other']=(mm[e.mode||'Other']||0)+(+e.amount||0); });
  bars(cm,$('#cats')); bars(mm,$('#modes'));
}

/* ---------- modal helper ---------- */
function openSheet(html){

}

  const ids=picked.map(i=>i.id);

  const cat=(S.shopCat||{})[shop] || 'Groceries';
  const {back,close}=openSheet(`<form class="sheet" id="billForm">
    <div><h2>Pay at ${esc(shop)}</h2><p class="hint">${picked.length} item${picked.length>1?'s':''} picked${est?` · estimated ${money(est)}`:''}</p></div>
    <div class="bill">${picked.map(i=>`<div><span>${esc(i.name)} <span style="color:var(--muted)">${+i.qty||''} ${esc(i.unit)}</span></span><span class="num">${i.price?money(i.price):'—'}</span></div>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:4px"><label class="l" for="bpAmt">Total paid ₹</label>
      <input id="bpAmt" type="number" min="0" step="any" inputmode="decimal" value="${est||''}" style="font:500 20px var(--mono)"></div>
    <div class="row" style="flex-wrap:nowrap">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0"><label class="l" for="bpMode">Paid by</label><select id="bpMode"><option>UPI</option><option>Cash</option><option>Card</option></select></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0"><label class="l" for="bpDate">Date</label><input id="bpDate" type="date" value="${today()}"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px"><label class="l" for="bpCat">Expense category</label><select id="bpCat">${CATS.map(c=>`<option${c===cat?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" data-a="cancel">Cancel</button>
      <button class="btn" type="button" data-a="only">Mark bought, no expense</button>
      <button class="btn pri" type="submit">Save bill</button>
    </div></form>`);
  const amtIn=back.querySelector('#bpAmt'); amtIn.focus(); amtIn.select();
  const current=()=>S.items.filter(i=>ids.includes(i.id)&&i.state==='picked');
  back.querySelector('[data-a="only"]').addEventListener('click',()=>{
    const list=current(); list.forEach(i=>i.state='bought'); commit(); close(); toast(`${list.length} item${list.length!==1?'s':''} marked as bought`);
  });
  back.querySelector('form').addEventListener('submit',ev=>{
    ev.preventDefault();
    const amt=+amtIn.value||0;
    if(!(amt>0)){ amtIn.focus(); toast('Enter the total you paid'); return; }
    const list=current();
    const c=back.querySelector('#bpCat').value;
    const names=list.map(i=>i.name);
    const desc=`${shop}: ${names.slice(0,4).join(', ')}${names.length>4?` +${names.length-4} more`:''}`;
    const e={id:uid(),date:back.querySelector('#bpDate').value||today(),desc,amount:amt,cat:c,mode:back.querySelector('#bpMode').value,shop};
    S.expenses.push(e);
    list.forEach(i=>{ i.state='bought'; i.purchaseId=e.id; });
    if(shop!==NO_SHOP){ S.shopCat={...(S.shopCat||{}),[shop]:c}; }
    commit(); close(); toast(`Saved ${money(amt)} bill for ${shop}`);
  });
}

function commit(){ const changed=stamp(); save(); render(); if(changed) scheduleSync(); }

/* ---------- events ---------- */
/* item form: auto-fill from last time, warn about duplicates */
const touched={shop:false,unit:false,price:false}, auto={shop:false,unit:false,price:false};
['shop','unit','price'].forEach(f=>{ const el=$('#i'+f[0].toUpperCase()+f.slice(1)); ['input','change'].forEach(t=>el.addEventListener(t,()=>{ touched[f]=true; auto[f]=false; })); });
const stateLabel = i => i.state==='picked'?'in cart':'to buy';
const descItem = i => [shopOf(i), (+i.qty||'')+' '+(i.unit||''), stateLabel(i)].map(x=>String(x).trim()).filter(Boolean).join(' · ');
function onNameInput(){
  const name=$('#iName').value, note=$('#iNote');
  const last=lastFor(name), dups=openDups(name);
  const fShop=$('#iShop'), fUnit=$('#iUnit'), fPrice=$('#iPrice');
  if(last){
    if(!touched.shop && last.shop){ fShop.value=last.shop; auto.shop=true; }
    if(!touched.unit && last.unit && [...fUnit.options].some(o=>o.value===last.unit)){ fUnit.value=last.unit; auto.unit=true; }
    if(!touched.price && last.price){ fPrice.value=last.price; auto.price=true; }
  } else {
    if(auto.shop){ fShop.value=''; auto.shop=false; }
    if(auto.unit){ fUnit.value='pcs'; auto.unit=false; }
    if(auto.price){ fPrice.value=''; auto.price=false; }
  }
  if(dups.length){
    note.className='item-note dup';
    note.textContent = `Already on your list: ${dups.map(descItem).join('; ')}`;
    note.hidden=false;
  } else if(lastBought(name)){
    const b=lastBought(name);
    note.className='item-note';
    note.textContent = `Bought before at ${shopOf(b)}. Adding it will move it back to To buy.`;
    note.hidden=false;
  } else if(last){
    note.className='item-note';
    note.textContent = `Filled in from last time${last.shop?`: ${last.shop}`:''}${last.price?` · ${money(last.price)}`:''}`;
    note.hidden=false;
  } else note.hidden=true;
}
$('#iName').addEventListener('input',onNameInput);

function addItem(rec){
  const old=lastBought(rec.name);
  if(old){
    // re-use the bought entry instead of adding a second one
    Object.assign(old,{qty:rec.qty,unit:rec.unit,price:rec.price||+old.price||0,shop:rec.shop,state:'pending'});
    delete old.purchaseId;
    S.items=[old,...S.items.filter(i=>i!==old)];
    toast(`${old.name} moved back to To buy`);
  } else S.items.unshift({id:uid(),...rec,state:'pending'});
  $('#iName').value=''; $('#iPrice').value=''; $('#iQty').value=1; $('#iNote').hidden=true; $('#iName').focus();
  Object.keys(touched).forEach(k=>{ touched[k]=false; auto[k]=false; });
  if(folded.delete(rec.shop||NO_SHOP)) saveFolded();
  listFilter='pending'; listSearch=''; $('#listSearch').value=''; syncChips(); commit();
}
$('#itemForm').addEventListener('submit',ev=>{
  ev.preventDefault();
  const name=$('#iName').value.trim(); if(!name) return;
  const rec={name,qty:+$('#iQty').value||0,unit:$('#iUnit').value,price:+$('#iPrice').value||0,shop:$('#iShop').value.trim()};
  const dups=openDups(name);
  if(!dups.length){ addItem(rec); return; }
  const same=dups.length===1 && dups[0].unit===rec.unit && rec.qty>0 && shopOf(dups[0])===(rec.shop||NO_SHOP) ? dups[0] : null;
  const {back,close}=openSheet(`<div class="sheet" role="dialog" aria-label="Item already on list">
    <div><h2>${esc(dups[0].name)} is already on your list</h2><p class="hint">You are adding ${rec.qty||''} ${esc(rec.unit)}${rec.shop?` at ${esc(rec.shop)}`:''}.</p></div>
    <div class="dup-list">${dups.map(i=>`<div><span>${esc(shopOf(i))}</span><span class="num">${+i.qty||''} ${esc(i.unit)} · ${stateLabel(i)}</span></div>`).join('')}</div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" data-a="cancel">Cancel</button>
      <button class="btn${same?'':' pri'}" type="button" data-a="again">Add separately</button>
      ${same?`<button class="btn pri" type="button" data-a="merge">Make it ${(+same.qty||0)+rec.qty} ${esc(rec.unit)}</button>`:''}
    </div></div>`);
  back.querySelector(same?'[data-a="merge"]':'[data-a="again"]').focus();
  back.querySelector('[data-a="again"]').addEventListener('click',()=>{ close(); addItem(rec); });
  if(same) back.querySelector('[data-a="merge"]').addEventListener('click',()=>{
    same.qty=(+same.qty||0)+rec.qty;
    if(rec.price) same.price=(+same.price||0)+rec.price;
    close();
    $('#iName').value=''; $('#iPrice').value=''; $('#iQty').value=1; $('#iNote').hidden=true;
    Object.keys(touched).forEach(k=>{ touched[k]=false; auto[k]=false; });
    commit(); toast(`${same.name} is now ${same.qty} ${same.unit}`);
  });
});
$('#listSearch').addEventListener('input',e=>{ listSearch=e.target.value; renderItems(); });
$('#foldAll').addEventListener('click',()=>{
  if(shownShops.every(s=>folded.has(s))) shownShops.forEach(s=>folded.delete(s)); else shownShops.forEach(s=>folded.add(s));
  saveFolded(); renderItems();
});
$('#searchClear').addEventListener('click',()=>{ listSearch=''; const i=$('#listSearch'); i.value=''; i.focus(); renderItems(); });
$('#itemList').addEventListener('click',ev=>{
  if(ev.target.closest('[data-showall]')){ listFilter='all'; syncChips(); renderItems(); return; }
  const fold=ev.target.closest('button[data-fold]');
  if(fold){ const s=fold.dataset.fold; if(!folded.delete(s)) folded.add(s); saveFolded(); renderItems(); return; }
  const pay=ev.target.closest('button[data-pay]'); if(pay){ payBill(pay.dataset.pay); return; }
  const b=ev.target.closest('button[data-act]'); if(!b) return;
  const id=b.closest('.item').dataset.id, item=S.items.find(i=>i.id===id); if(!item) return;
  if(b.dataset.act==='del'){ S.items=S.items.filter(i=>i.id!==id); commit(); toast('Item removed'); return; }
  if(item.state==='pending') item.state='picked';
  else if(item.state==='picked') item.state='pending';
  else {
    item.state='pending';
    if(item.purchaseId){ delete item.purchaseId; toast('Moved back to list. The saved bill is unchanged.'); }
  }
  commit();
});
function syncChips(){ document.querySelectorAll('#listFilter .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===listFilter)); }
$('#listFilter').addEventListener('click',ev=>{ const c=ev.target.closest('.chip'); if(!c) return; listFilter=c.dataset.f; syncChips(); renderItems(); });
$('#clearBought').addEventListener('click',()=>{
  const n=S.items.filter(i=>i.state==='bought').length; if(!n){ toast('No bought items to clear'); return; }
  S.items=S.items.filter(i=>i.state!=='bought'); commit(); toast(`Cleared ${n} bought item${n>1?'s':''}. Expenses kept.`);
});

$('#expForm').addEventListener('submit',ev=>{
  ev.preventDefault();
  const desc=$('#eDesc').value.trim(), amt=+$('#eAmt').value; if(!desc||!(amt>0)) return;
  S.expenses.push({id:uid(),date:day,desc,amount:amt,cat:$('#eCat').value,mode:$('#eMode').value});
  $('#eDesc').value=''; $('#eAmt').value=''; $('#eDesc').focus(); commit(); toast(`Added ${money(amt)}`);
});
$('#expList').addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-act="delExp"]'); if(!b) return;
  const id=b.closest('.item').dataset.id;
  S.expenses=S.expenses.filter(e=>e.id!==id);
  S.items.forEach(i=>{ if(i.purchaseId===id){ delete i.purchaseId; } });
  commit(); toast('Expense deleted');
});
$('#recentDays').addEventListener('click',ev=>{ const r=ev.target.closest('[data-day]'); if(r){ day=r.dataset.day; renderExp(); window.scrollTo({top:0}); } });
$('#dPick').addEventListener('change',e=>{ if(e.target.value){ day=e.target.value; renderExp(); } });
$('#dPrev').addEventListener('click',()=>{ day=addDays(day,-1); renderExp(); });
$('#dNext').addEventListener('click',()=>{ day=addDays(day,1); renderExp(); });
$('#dToday').addEventListener('click',()=>{ day=today(); renderExp(); });

const shiftMonth=n=>{ const d=parse(month+'-01'); d.setMonth(d.getMonth()+n); month=ymd(d).slice(0,7); renderSum(); };
$('#mPrev').addEventListener('click',()=>shiftMonth(-1));
$('#mNext').addEventListener('click',()=>shiftMonth(1));
$('#mPick').addEventListener('change',e=>{ if(e.target.value){ month=e.target.value; renderSum(); } });
$('#tab-sum').addEventListener('submit',ev=>{ if(ev.target.id!=='budgetForm') return; ev.preventDefault(); S.budget=+$('#bAmt').value||0; $('#bAmt').blur(); commit(); toast('Budget saved'); });
$('#chart').addEventListener('click',ev=>{ const c=ev.target.closest('[data-day]'); if(c){ day=c.dataset.day; showTab('exp'); renderExp(); } });

/* tabs */
function showTab(t){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['list','exp','sum'].forEach(k=>$('#tab-'+k).hidden = k!==t);
  try{ localStorage.setItem(KEY+'-tab',t); }catch(e){}
  window.scrollTo({top:0});
}
document.querySelector('nav.tabs').addEventListener('click',ev=>{ const b=ev.target.closest('button[data-tab]'); if(b) showTab(b.dataset.tab); });

/* backup / restore / csv */
function download(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('#exportBtn').addEventListener('click',()=>{ download(`kharcha-book-backup-${today()}.json`,JSON.stringify(S,null,2),'application/json'); toast('Backup file downloaded'); });
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.items)||!Array.isArray(d.expenses)) throw 0; d.sample=false; S=migrate(d); commit(); toast('Backup restored'); }
    catch(e){ toast('That file is not a Kharcha Book backup'); } ev.target.value=''; };
  r.readAsText(f);
});
$('#csvBtn').addEventListener('click',()=>{
  const ex=S.expenses.filter(e=>dateOf(e).startsWith(month)).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
  if(!ex.length){ toast('No expenses in this month'); return; }
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const csv=['Date,Description,Category,Paid by,Amount'].concat(ex.map(e=>[e.date,q(e.desc),q(e.cat),e.mode,e.amount].join(','))).join('\n');
  download(`expenses-${month}.csv`,csv,'text/csv'); toast('CSV downloaded');
});

/* ---------- Google Sheet sync ---------- */
let cfg = {url:'',key:'',last:0};
try{ cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY)||'{}')); }catch(e){}
const saveCfg = () => { try{ localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); }catch(e){} };
let syncing=false, again=false, syncTimer=null, syncState='off', syncErr='';

function setStatus(st, err){
  syncState=st; syncErr=err||'';
  const dot=$('#syncDot'), lbl=$('#syncLabel');
  dot.className='dot'+(st==='ok'?' ok':st==='busy'?' busy':(st==='error'||st==='offline')?' err':'');
  const time = cfg.last ? new Date(cfg.last).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : '';
  lbl.textContent = st==='off'?'Sync off' : st==='busy'?'Syncing…' : st==='ok'?`Synced ${time}` : st==='offline'?'Offline' : 'Sync error';
  const line=$('#syncStatusLine');
  if(line){ line.textContent = statusText(); line.classList.toggle('err', st==='error'); }
}
function statusText(){
  if(syncState==='off') return 'Not connected. Data is saved only on this device.';
  if(syncState==='busy') return 'Syncing with your Google Sheet…';
  if(syncState==='offline') return 'No internet. Changes are saved here and will sync when you are back online.';
  if(syncState==='error') return 'Could not sync: ' + syncErr + '. Your changes are safe on this device and will be sent on the next try.';
  return 'Connected. Last synced ' + new Date(cfg.last).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) + '.';
}
function scheduleSync(delay){ if(!cfg.url) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, delay??1200); }

function payload(){
  const out={key:cfg.key, settings:{...settingsOf(), u:S.settingsU||0}};
  TABLES.forEach(k=>{
    out[k] = S[k].filter(r=>!r.ex).map(r=>({...r}))
      .concat(Object.entries(S.tomb[k]).map(([id,u])=>({id,u,del:true})));
  });
  return out;
}
function clean(k,r){
  const o={...r}; delete o.del; o.u=+o.u||0; o.id=String(o.id);
  if(k==='items'){
    o.name=String(o.name||''); o.qty=+o.qty||0; o.price=+o.price||0; o.unit=o.unit||'pcs'; o.shop=String(o.shop||'');
    o.state=['pending','picked','bought'].includes(o.state)?o.state:'pending';
    if(!o.purchaseId) delete o.purchaseId;
  } else {
    o.date=String(o.date||today()); o.desc=String(o.desc||''); o.amount=+o.amount||0; o.cat=o.cat||'Other'; o.mode=o.mode||'UPI';
    if(!o.shop) delete o.shop;
  }
  return o;
}
function applyServer(data){
  let changed=false;
  TABLES.forEach(k=>{
    (data[k]||[]).forEach(r=>{
      if(!r||!r.id) return;
      const su=+r.u||0;
      const idx=S[k].findIndex(x=>x.id===r.id);
      const lu = idx>=0 ? (+S[k][idx].u||0) : (S.tomb[k][r.id]??-1);
      if(su<=lu) return;
      changed=true;
      if(r.del){
        if(idx>=0) S[k].splice(idx,1);
        S.tomb[k][r.id]=su;
      } else {
        const rec=clean(k,r);
        delete S.tomb[k][r.id];
        if(idx>=0){ const cur=S[k][idx]; Object.keys(cur).forEach(key=>delete cur[key]); Object.assign(cur,rec); }
        else S[k].push(rec);
      }
    });
  });
  const st=data.settings||{};
  if((+st.u||0) > (S.settingsU||0)){
    S.budget=+st.budget||0; S.shopCat=st.shopCat||{}; S.settingsU=+st.u; changed=true;
  }
  return changed;
}
async function syncNow(){
  if(!cfg.url) return;
  if(syncing){ again=true; return; }
  if(stamp()) save();
  syncing=true; setStatus('busy');
  try{
    const res=await fetch(cfg.url,{method:'POST',body:JSON.stringify(payload()),redirect:'follow'});
    let data; try{ data=await res.json(); }catch(e){ throw new Error('the script URL did not return data. Check the Web app URL and that access is set to Anyone'); }
    if(!data.ok) throw new Error(data.error||'unknown problem');
    stamp();
    const changed=applyServer(data);
    takeSnap(); save();
    if(changed) render();
    cfg.last=Date.now(); saveCfg(); setStatus('ok');
  }catch(e){
    setStatus(navigator.onLine===false?'offline':'error', e.message==='Failed to fetch'||e.name==='TypeError'?'could not reach the script':e.message);
  }finally{
    syncing=false;
    if(again){ again=false; scheduleSync(300); }
  }
}

function syncSetup(){
  const script=$('#gsCode').textContent.trim();
  const {back,close}=openSheet(`<form class="sheet" id="syncForm" style="max-width:520px">
    <div><h2>Sync with Google Sheet</h2><p class="status-line" id="syncStatusLine"></p></div>
    <details ${cfg.url?'':'open'}>
      <summary style="cursor:pointer;font-weight:600">One-time setup (about 3 minutes)</summary>
      <ol class="steps" style="margin-top:10px">
        <li>On a computer, create a new Google Sheet. Typing <span class="code-inline">sheets.new</span> in the address bar works.</li>
        <li>In the sheet, open <b>Extensions → Apps Script</b>. Delete the code that is there and paste the script below.</li>
        <li>In the pasted script, change <span class="code-inline">change-this-password</span> to your own password, then save.</li>
        <li>Click <b>Deploy → New deployment</b>. Choose type <b>Web app</b>, set <b>Execute as: Me</b> and <b>Who has access: Anyone</b>, then <b>Deploy</b>. Allow access when Google asks.</li>
        <li>Copy the <b>Web app URL</b> and paste it below with your password. Do the same on each phone or computer.</li>
      </ol>
      <div class="row between" style="margin-top:10px"><span class="label">Apps Script code</span><button class="btn" type="button" id="copyScript">Copy script</button></div>
      <textarea class="code" id="scriptBox" readonly aria-label="Apps Script code">${esc(script)}</textarea>
    </details>
    <div style="display:flex;flex-direction:column;gap:4px"><label class="l" for="cfgUrl">Web app URL</label>
      <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.url)}" autocomplete="off"></div>
    <div style="display:flex;flex-direction:column;gap:4px"><label class="l" for="cfgKey">Password (the SECRET in the script)</label>
      <input id="cfgKey" type="password" value="${esc(cfg.key)}" autocomplete="off"></div>
    <p class="hint">Entries from this device and the sheet are combined; nothing is overwritten. To delete a row from inside the sheet, set its <b>Deleted</b> cell to TRUE.</p>
    <div class="row" style="justify-content:flex-end">
      ${cfg.url?'<button class="btn ghost danger" type="button" id="disconnect">Disconnect</button>':''}
      <button class="btn ghost" type="button" data-a="cancel">Close</button>
      <button class="btn pri" type="submit">${cfg.url?'Save & sync now':'Connect'}</button>
    </div></form>`);
  setStatus(syncState, syncErr);
  back.querySelector('#copyScript').addEventListener('click',()=>{
    const box=back.querySelector('#scriptBox');
    const fallback=()=>{ box.focus(); box.select(); toast('Script selected. Copy it from the menu.'); };
    try{ navigator.clipboard.writeText(script).then(()=>toast('Script copied'),fallback); }catch(e){ fallback(); }
  });
  const dc=back.querySelector('#disconnect');
  if(dc) dc.addEventListener('click',()=>{ cfg={url:'',key:'',last:0}; saveCfg(); setStatus('off'); close(); toast('Sync turned off. Data stays on this device.'); });
  back.querySelector('form').addEventListener('submit',ev=>{
    ev.preventDefault();
    const url=back.querySelector('#cfgUrl').value.trim(), key=back.querySelector('#cfgKey').value;
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('Paste the Web app URL that starts with https://script.google.com/'); return; }
    if(!key){ toast('Enter the password you set in the script'); return; }
    const first=!cfg.url;
    cfg.url=url; cfg.key=key; saveCfg();
    if(first){
      // drop untouched example entries so they don't get uploaded
      S.items=S.items.filter(r=>!r.ex); S.expenses=S.expenses.filter(r=>!r.ex);
      if(S.sample && !S.settingsU){ S.budget=0; S.shopCat={}; }
      S.sample=false; takeSnap(); save(); render();
    }
    syncNow().then(()=>{ if(syncState==='ok') toast('Synced with Google Sheet'); });
  });
}
$('#syncBtn').addEventListener('click',syncSetup);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') scheduleSync(200); });
window.addEventListener('online',()=>scheduleSync(200));
setInterval(()=>{ if(cfg.url && document.visibilityState==='visible' && !document.querySelector('.back')) syncNow(); },30000);

/* init */
render();
let startTab='list'; try{ startTab=localStorage.getItem(KEY+'-tab')||'list'; }catch(e){}
showTab(['list','exp','sum'].includes(startTab)?startTab:'list');
if(cfg.url){ setStatus('ok'); syncNow(); } else setStatus('off');
})();
</script>
